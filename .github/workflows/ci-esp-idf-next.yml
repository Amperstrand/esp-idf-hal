# RUNNER POLICY (2026-10-29, Amperstrand/ops#43): prefer the org's
# self-hosted fleet, hosted as fallback. This workflow gates push(master)
# as well as the nightly, so its legs must never SKIP: pick-runner (a
# secret-free executed-jobs probe — the runners API is admin-only to job
# tokens) routes dynamically — fleet heartbeat within 24h =>
# [self-hosted, legion-vm] (warm espup toolchains + target dirs via
# clean:false are most of the win), otherwise ubuntu-latest unchanged.
name: CIEspIdfNext

on:
  push:
    branches:
      - master
  schedule:
    - cron: "50 5 * * *"
  workflow_dispatch:

# A new run for the same branch or PR cancels the one still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  rust_toolchain: nightly
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Compile-time configuration of the networking examples
  WIFI_SSID: "ssid"
  WIFI_PASS: "pass"
  ESP_DEVICE_IP: "192.168.1.250"
  GATEWAY_IP: "192.168.1.1"
  GATEWAY_NETMASK: "24"

jobs:
  pick-runner:
    name: pick runner (prefer self-hosted)
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - name: Probe fleet availability (secret-free)
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Availability = a job executed on a legion/ai-legion runner within
          # 24h (machine-class heartbeat; the runners API is admin-only to
          # job tokens). Own repo first; the kali-live-headless CI lane
          # bootstraps the signal for first-time repos.
          cutoff=$(date -u -d '24 hours ago' +%s)
          case "$cutoff" in ''|*[!0-9]*) echo "::error::bad cutoff"; exit 1 ;; esac
          used_fleet_ever() { # repo pages -> EVER used a fleet runner?
            # No date filter: distinguishes "first-timer" (bootstrap via
            # the kali fallback) from "had fleet runners, now DARK" — the
            # dark case must NOT be masked by another repo's heartbeat, or
            # legs queue forever on a label no live runner serves
            # (2026-10-31: ccid fuzz queued 16h while the box was healthy).
            local repo=$1 pages=$2 runs run verdict
            runs=$(gh api "repos/$repo/actions/runs?per_page=$pages&status=completed" \
              --jq '.workflow_runs[].id' 2>/dev/null) || return 1
            for run in $runs; do
              verdict=$(gh api "repos/$repo/actions/runs/$run/jobs" \
                --jq 'any(.jobs[]; ((.runner_name // "") | (startswith("legion-") or startswith("ai-legion"))))' 2>/dev/null || true)
              [ "$verdict" = true ] && return 0
            done
            return 1
          }
          saw_fleet() {
            local repo=$1 pages=$2 runs run verdict
            runs=$(gh api "repos/$repo/actions/runs?per_page=$pages" \
              --jq ".workflow_runs[]
                    | select(.status == \"completed\")
                    | select((.updated_at | fromdateiso8601) > $cutoff)
                    | .id" 2>&1) || {
              echo "::notice::probe $repo listing failed: $(printf '%s' "$runs" | tail -1)"
              return 1
            }
            for run in $runs; do
              verdict=$(gh api "repos/$repo/actions/runs/$run/jobs" \
                --jq 'any(.jobs[]; ((.runner_name // "") | (startswith("legion-") or startswith("ai-legion"))))' 2>/dev/null || true)
              if [ "$verdict" = true ]; then
                echo "::notice::probe $repo: run $run executed on a fleet runner"
                return 0
              fi
            done
            echo "::notice::probe $repo: no fleet runner within 24h"
            return 1
          }
          if saw_fleet "${{ github.repository }}" 15; then
            echo 'runner=["self-hosted","legion-vm"]' >> "$GITHUB_OUTPUT"
          elif used_fleet_ever "${{ github.repository }}" 12; then
            echo '::notice::probe: this repo HAS fleet runners but none ran within 24h (dark) — falling back to hosted instead of queueing forever'
            echo 'runner="ubuntu-latest"' >> "$GITHUB_OUTPUT"
          elif saw_fleet Amperstrand/kali-live-headless 5; then
            echo 'runner=["self-hosted","legion-vm"]' >> "$GITHUB_OUTPUT"
          else
            echo 'runner="ubuntu-latest"' >> "$GITHUB_OUTPUT"
          fi
      - name: Lane summary
        run: |
          {
            echo "## Runner lane"
            echo '```'
            echo "runner: ${{ steps.pick.outputs.runner }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  compile:
    name: "${{ matrix.target }} / ${{ matrix.idf-version }}"
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runner) }}
    # esp-idf builds are chunky; bound the leg and the queue race
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - riscv32imc-esp-espidf
          - riscv32imac-esp-espidf
          - riscv32imafc-esp-espidf
          - xtensa-esp32-espidf
          - xtensa-esp32s2-espidf
          - xtensa-esp32s3-espidf
        idf-version:
#          - release/v6.2
          - master
    env:
      ESP_IDF_VERSION: ${{ matrix.idf-version }}
      RUSTFLAGS: "--cfg espidf_time64"
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v3
        with:
          # persistent runners keep target/ + examples' build dirs warm;
          # hosted legs are fresh VMs either way
          clean: false

      # A CI cell builds ESP-IDF twice (the std and no_std variants of esp-idf-sys differ in
      # features, hence in build-script output directory) and links all examples, which
      # does not fit next to the pre-installed toolchains of the runner image
      - name: Setup | Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          df -h /

      # The toolchains are installed by hand rather than with the dtolnay/rust-toolchain and
      # esp-rs/xtensa-toolchain actions, so that their downloads can be retried: they fail
      # now and then on a reset connection, and composite actions cannot be wrapped in a retry
      - name: Setup | Rust
        if: matrix.target == 'riscv32imc-esp-espidf'
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          .github/retry.sh rustup toolchain install ${{ env.rust_toolchain }} --profile minimal --component rustfmt,clippy,rust-src
          rustup default ${{ env.rust_toolchain }}

      - name: Setup | Rust for Xtensa
        if: matrix.target != 'riscv32imc-esp-espidf'
        run: |
          # rustup lives in ~/.cargo/bin; job shells are non-login, so PATH
          # must be exported explicitly (ubuntu-latest preinstalls it
          # system-wide — other runners do not)
          export PATH="$HOME/.cargo/bin:$PATH"
          # rustc -vV is version-stable; `rustup show` dropped "Default host"
          # from its non-verbose output in 1.29 (broke this on runners
          # with fresh rustups — the fleet hit it 2026-10-29)
          host=$(rustc -vV | sed -n 's/^host: //p')
          .github/retry.sh curl -sSfL https://github.com/esp-rs/espup/releases/latest/download/espup-$host -o "$HOME/.cargo/bin/espup"
          chmod +x "$HOME/.cargo/bin/espup"
          # A failed install must not leave a partial toolchain behind for the next attempt to skip
          export ESPUP_EXPORT_FILE="$HOME/exports"
          for attempt in 1 2 3; do
            rm -rf "$HOME/.rustup/toolchains/esp"
            "$HOME/.cargo/bin/espup" install -l debug --targets esp32,esp32s2,esp32s3 && break
            [ "$attempt" -lt 3 ] && { echo "::warning::espup install attempt $attempt failed; retrying in 20s"; sleep 20; } || exit 1
          done
          source "$ESPUP_EXPORT_FILE"
          # the build also drives the plain nightly toolchain; without
          # rust-src it dies with 'unable to build with the standard
          # library' (present incidentally on hosted images, not on
          # self-hosted ones)
          rustup toolchain install nightly --profile minimal --component rust-src >/dev/null 2>&1 || rustup component add rust-src --toolchain nightly
          echo "$PATH" >> "$GITHUB_PATH"
          echo "LIBCLANG_PATH=${LIBCLANG_PATH}" >> "$GITHUB_ENV"
          echo "CLANG_PATH=${CLANG_PATH}" >> "$GITHUB_ENV"
          rustup default esp

      - name: Setup | ldproxy
        run: |
          .github/retry.sh curl -sSfL https://github.com/esp-rs/embuild/releases/latest/download/ldproxy-x86_64-unknown-linux-gnu.zip -o $HOME/.cargo/bin/ldproxy.zip
          # -o: persistent runners keep the previous run's binary; without it
          # unzip asks "replace?" interactively and dies on EOF (2026-10-29)
          unzip -o "$HOME/.cargo/bin/ldproxy.zip" -d "$HOME/.cargo/bin/"
          chmod a+x $HOME/.cargo/bin/ldproxy

      - name: Build | Fmt Check
        run: cargo fmt --all -- --check

      # The examples package depends on the three crates with their full feature set, so a single
      # workspace-wide invocation lints/compiles every crate and every example with all features on
      - name: Build | Clippy, all crates and examples
        run: cargo clippy --workspace --lib --bins --no-deps --target ${{ matrix.target }} -Zbuild-std=std,panic_abort -- -Dwarnings

      - name: Build | Compile, all crates and examples
        run: cargo build --workspace --lib --bins --target ${{ matrix.target }} -Zbuild-std=std,panic_abort

      # Only the three crates are selected here: the examples need `std`
      - name: Build | Compile, no_std
        run: cargo build -p esp-idf-sys -p esp-idf-hal -p esp-idf-svc --no-default-features --features esp-idf-hal/experimental,esp-idf-svc/nightly,esp-idf-svc/experimental --target ${{ matrix.target }} -Zbuild-std=std,panic_abort

      - name: Build | Compile, no_std, alloc
        run: cargo build -p esp-idf-sys -p esp-idf-hal -p esp-idf-svc --no-default-features --features esp-idf-hal/alloc,esp-idf-hal/experimental,esp-idf-svc/alloc,esp-idf-svc/nightly,esp-idf-svc/experimental --target ${{ matrix.target }} -Zbuild-std=std,panic_abort
